[package]
name = "quickik-cpp"
description = "C++ bindings for the QuickIK inverse kinematics library"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "quickik_cpp"
crate-type = ["staticlib"]

[dependencies]
bytemuck = "1"
diplomat = "0.16"
diplomat-runtime = "0.16"
nalgebra = { version = "0.35", features = ["convert-bytemuck"] }
quickik_core = { package = "quickik", path = ".." }

[build-dependencies]
diplomat-tool = "0.16"
