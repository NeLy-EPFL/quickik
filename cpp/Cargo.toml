[package]
name = "quickik-cpp"
description = "C++ bindings for the QuickIK inverse kinematics library"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "quickik_cpp"
crate-type = ["staticlib"]

[dependencies]
cxx = "1"
quickik_core = { package = "quickik", path = ".." }
nalgebra = "0.35"

[build-dependencies]
cxx-build = "1"
