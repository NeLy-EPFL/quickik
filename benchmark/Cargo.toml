[package]
name = "fastik-benchmark"
description = "Correctness cross-check and throughput/latency benchmark for fastik, against flygym.ik on the NeuroMechFly model"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
fastik = { path = ".." }
nalgebra = "0.35"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
