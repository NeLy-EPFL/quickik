[package]
name = "quickik-benchmark"
description = "Correctness cross-check and throughput/latency benchmark for quickik's Rust API, against flygym.ik on the NeuroMechFly model"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "quickik_benchmark"
path = "src/lib.rs"

[[bin]]
name = "quickik-benchmark"
path = "src/main.rs"

[dependencies]
quickik = { path = "../.." }
nalgebra = "0.35"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
