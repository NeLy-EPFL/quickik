[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "quickik"
version = "0.1.0"
description = "Python bindings for the QuickIK inverse kinematics library"
requires-python = ">=3.8"
dependencies = ["numpy"]

[project.optional-dependencies]
torch = ["torch"]

[tool.maturin]
module-name = "quickik"
python-source = "python"

[tool.uv]
# Rebuild when the Rust sources change, not only this file (e.g. for the examples,
# which depend on this package by path through `uv run`).
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "src/**/*.rs" },
    { file = "../Cargo.toml" },
    { file = "../src/**/*.rs" },
]
