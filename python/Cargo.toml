[package]
name = "quickik-python"
description = "Python bindings for the QuickIK inverse kinematics library"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "quickik"
crate-type = ["cdylib"]

[dependencies]
quickik_core = { package = "quickik", path = ".." }
nalgebra = "0.35"
pyo3 = { version = "0.29", features = ["extension-module"] }
numpy = "0.29.0"
