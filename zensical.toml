[project]
site_name = "QuickIK"
site_description = "Fast inverse kinematics library"
site_url = "https://nely-epfl.github.io/quickik/"

repo_url = "https://github.com/NeLy-EPFL/quickik"
repo_name = "NeLy-EPFL/quickik"
edit_uri = "edit/main/docs/"

nav = [
  { "Home" = "index.md" },
  { "Getting started" = [
      { "Installation" = "getting-started/installation.md" },
      { "Body plan" = "getting-started/body-plan.md" },
      { "Solve for a single frame" = "getting-started/single-frame.md" },
      { "Solve sequences of frames" = "getting-started/sequences.md" },
      { "From 2D keypoint positions" = "getting-started/2d-keypoints.md" },
    ] },
  { "API references" = [
      { "Rust (native)" = "api/rust/quickik/index.html" },
      { "Python bindings" = "api/python/quickik.html" },
      { "C++ bindings" = "api/cpp/html/index.html" },
    ] },
  { "Technical information" = [
      { "Benchmarks" = "technical/benchmarks.md" },
      # { "Technical paper & citation" = "technical/paper.md" },
    ] },
]

# Not deployed yet -- there is nothing to publish until this is released on
# crates.io/PyPI. Kept here so a version switcher can be turned on later
# (via `mike`) without restructuring the site.
# [project.extra.version]
# provider = "mike"

[project.theme]
language = "en"
features = [
    "content.action.edit",
    "content.code.copy",
    "content.tabs.link",
    "navigation.indexes",
    "navigation.sections",
    "navigation.top",
    "navigation.footer",
    "search.highlight",
    "content.tooltips",
    "content.footnote.tooltips",
]

[project.theme.icon]
repo = "fontawesome/brands/github"

# Matches the font the benchmark charts are rendered with (see
# benchmark/plot/plot_comparison.py's register_fonts()), so their SVG
# <text> elements -- which reference "Open Sans" by name rather than
# embedding it -- render correctly instead of falling back to a generic
# sans-serif.
[project.theme.font]
text = "Open Sans"

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions.admonition]
[project.markdown_extensions.abbr]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.footnotes]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.superfences]
# Without an explicit `slugify`, tab panels get an unreadable auto-numbered
# id (e.g. "#__tabbed_3_2") instead of a real anchor
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true
slugify = { object = "pymdownx.slugs.slugify", kwds = { case = "lower" } }
