[project]
site_name = "FastIK"
site_description = "Fast inverse kinematics library"
site_url = "https://sibocw.github.io/fastik/"

repo_url = "https://github.com/sibocw/fastik"
repo_name = "sibocw/fastik"
edit_uri = "edit/main/docs/"

nav = [
  { "Home" = "index.md" },
  { "Installation" = "installation.md" },
  { "Usage" = "usage.md" },
  { "Benchmarks" = "benchmarks.md" },
  { "API reference (Rust)" = "api/rust/fastik/index.html" },
  { "API reference (Python)" = "api/python/fastik.html" },
  { "API reference (C++)" = "api/cpp/html/index.html" },
]

# Not deployed yet -- there is nothing to publish until this is released on
# crates.io/PyPI. Kept here so a version switcher can be turned on later
# (via `mike`) without restructuring the site.
# [project.extra.version]
# provider = "mike"

[project.theme]
language = "en"
features = [
    "content.action.edit",
    "content.code.copy",
    "content.tabs.link",
    "navigation.indexes",
    "navigation.sections",
    "navigation.top",
    "navigation.footer",
    "search.highlight",
]

[project.theme.icon]
repo = "fontawesome/brands/github"

# Matches the font the benchmark charts are rendered with (see
# benchmark/plot/plot_comparison.py's register_fonts()), so their SVG
# <text> elements -- which reference "Open Sans" by name rather than
# embedding it -- render correctly instead of falling back to a generic
# sans-serif.
[project.theme.font]
text = "Open Sans"

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
