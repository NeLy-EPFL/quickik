name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Also exercises the python/ (pyo3) and cpp/ (cxx) crates, since they're
      # workspace members -- this just builds them, as neither has its own
      # #[test]s (see the cpp-test job below for the C++ bindings' own suite).
      - run: cargo test --workspace

  cpp-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build cpp/build -j
      - run: ./cpp/build/quickik_cpp_tests
